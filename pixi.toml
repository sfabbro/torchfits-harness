[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
# Same manager pin as torchfits so the two locks are solved with one Pixi.
requires-pixi = "==0.82.0"

[dependencies]
python = "3.13.*"
pytest = ">=9.0"
numpy = ">=1.26"
# Match the torchfits wheel lane. conda-forge pins libabseil per pyarrow minor.
pyarrow = ">=25.0.0,<26"
astropy = ">=6.1"
fitsio = ">=1.4"
fitsverify = ">=4.22"  # harness-only: cross-check `torchfits verify`
matplotlib = ">=3.11"
pandas = ">=2.2"
psutil = ">=5"
pytorch = ">=2.14,<2.15"
pip = ">=24"
astroquery = ">=0.4.11,<0.5"
pytest-cov = ">=7.1.0,<8"
gcovr = ">=8"

[activation.env]
PYTHONNOUSERSITE = "1"

[tasks]
dev = "pip install -e . --no-deps"
# Install a torchfits wheel, then this package. Pass the wheel path after --.
subject = "pip install --no-deps"
test = "pytest tests/test_fitsio_upstream_smoke.py tests/test_astropy_upstream_smoke.py tests/test_layout.py tests/test_verify_vs_fitsverify.py -q"
bench-cpp = "python benchmarks/bench_cpp_backend.py"
# Real-archive corpus (~16 GB full tier; the CI tier is ~8 MB).
corpus-fetch = "python scripts/fetch_corpus.py --tier full --update-manifest"
corpus-list = "python scripts/fetch_corpus.py --tier full --list"
corpus-verify = "python scripts/fetch_corpus.py --tier full --verify"
corpus-test = "pytest tests/test_corpus_manifest.py tests/test_corpus_parity.py tests/test_operation_matrix.py tests/test_write_parity.py -q"
oracle-test = "pytest tests/test_cfitsio_oracle.py -q"
# Upstream behaviour replays: fitsio, astropy, CFITSIO, CCfits, EleFits, qfits, sfitsio.
replay-test = "pytest tests/test_replay_*.py tests/test_upstream_parity_inventory.py -q"
# Public-surface gate: every exported symbol must be mentioned by a test.
surface-report = "python scripts/surface_report.py"
surface-update = "python scripts/surface_report.py --update --markdown docs/public-surface.md"
# Contract gates: the corpus benchmark, the CLI, the public surface and the
# executed docs tour. They skip the corpus-dependent cases when it is absent.
contract-test = "pytest tests/test_bench_corpus.py tests/test_cli_suite.py tests/test_public_surface.py tests/test_tour.py -q"
# Line coverage of the installed torchfits wheel (no source, no compilation).
coverage-python = "pytest tests -q --cov=torchfits --cov-report=term:skip-covered --cov-report=html:reports/python-coverage"
# C/C++ coverage needs an instrumented build; see docs/coverage.md.
coverage-cpp = "bash scripts/cpp_coverage.sh"
# Real archive files: same three readers, same file, one interleaved timer.
bench-corpus = "python -m benchmarks.bench_corpus"
# Per-call Python overhead over the nanobind bindings (docs/api-overhead.md).
api-overhead = "python scripts/api_overhead.py"
# Local suites use this env. The subject is an installed torchfits wheel, not a
# build of this repo. Set TORCHFITS_BENCH_ENV to select another Pixi env.
bench-fits = "python benchmarks/bench_all.py --profile user --fits-only"
bench-fitstable = "python benchmarks/bench_all.py --profile user --fitstable-only"
bench-mps = "python benchmarks/bench_all.py --profile user --fits-only"
bench-all = "python benchmarks/bench_all.py --profile user --scope all"
bench-ml = "python benchmarks/bench_ml_loader.py"
bench-megacam = "python benchmarks/bench_megacam_cutouts.py"
bench-suite = "bash scripts/bench_suite.sh"
bench-exhaustive-local = "bash scripts/bench_exhaustive_local.sh"
bench-deficit-focus = "bash scripts/bench_deficit_focus.sh"
bench-cfitsio-direct = "bash scripts/bench_cfitsio_direct.sh"
bench-release-scorecard = "bash scripts/bench_release_scorecard.sh"
bench-median-stack = "python benchmarks/bench_median_stack.py"
bench-metadata = "python benchmarks/bench_metadata.py"

[pypi-dependencies]
torchfits-harness = { path = ".", editable = true }
