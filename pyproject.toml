[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchfits-harness"
version = "0.1.0"
description = "Benchmarks, upstream parity, and migration notes for torchfits"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torchfits>=1.3.0"]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "astroquery>=0.4.11",
    "astropy>=6.1",
    "fitsio>=1.4",
    "numpy>=1.26",
    "pyarrow>=25.0.0,<26",
    "psutil>=5",
    "pandas>=2.2",
]
bench = [
    "astropy>=6.1",
    "fitsio>=1.4",
    "numpy>=1.26",
    "pyarrow>=25.0.0,<26",
    "pandas>=2.2",
    "matplotlib>=3.11",
    "psutil>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: performance-oriented benchmark or stress tests",
    "integration: integration tests across multiple modules",
]

[tool.ruff]
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
